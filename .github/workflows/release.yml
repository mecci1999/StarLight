name: Release desktop clients

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS ARM64 DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tauri:build:macos --target aarch64-apple-darwin
      - run: shasum -a 256 src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg > SHA256SUMS-macos-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: starlight-macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            SHA256SUMS-macos-arm64.txt

  macos-x64:
    name: macOS Intel DMG
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tauri:build:macos --target x86_64-apple-darwin
      - run: shasum -a 256 src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg > SHA256SUMS-macos-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: starlight-macos-x64
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            SHA256SUMS-macos-x64.txt

  windows-x64:
    name: Windows x64 EXE and MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tauri:build:windows --target x86_64-pc-windows-msvc
      - shell: pwsh
        run: Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle -Recurse -Include *.exe,*.msi | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } | Set-Content SHA256SUMS-windows-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: starlight-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            SHA256SUMS-windows-x64.txt

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-arm64, macos-x64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
